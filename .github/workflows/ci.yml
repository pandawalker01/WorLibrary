name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run machine-readable quality gate
        env:
          # Contract-only values: CI tests use local mocks and never contact these services.
          VITE_SUPABASE_URL: https://ci.example.test
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          AI_PROVIDER: openai
          AI_MODEL: ci-model
          AI_API_KEY: ci-contract-only-key
          AI_BASE_URL: https://provider.example.test/v1
          AI_ENV: production
          AI_REQUIRE_AUTH: 'true'
          OCR_PROVIDER: ci-ocr
          OCR_API_KEY: ci-contract-only-key
          OCR_BASE_URL: https://ocr.example.test/v1
          OCR_ENV: production
          OCR_REQUIRE_AUTH: 'true'
          SUPABASE_URL: https://ci.example.test
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_JWT_SECRET: ci-contract-only-jwt-secret
          ALLOWED_ORIGIN: https://ci.example.test
        run: npm run quality

  preview:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate staging deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run validate:env -- --staging --deployment
      # Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the staging environment.
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--yes'
          scope: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate production deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm run validate:env -- --staging --deployment
      - id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod --yes'
          scope: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
