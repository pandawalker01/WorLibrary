name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target configured in GitHub Environments
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run machine-readable quality gate
        env:
          # Contract-only values: CI tests use local mocks and never contact these services.
          VITE_SUPABASE_URL: https://ci.example.test
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          AI_PROVIDER: openai
          AI_MODEL: ci-model
          AI_API_KEY: ci-contract-only-key
          AI_BASE_URL: https://provider.example.test/v1
          AI_ENV: production
          AI_REQUIRE_AUTH: 'true'
          OCR_PROVIDER: ci-ocr
          OCR_API_KEY: ci-contract-only-key
          OCR_BASE_URL: https://ocr.example.test/v1
          OCR_ENV: production
          OCR_REQUIRE_AUTH: 'true'
          SUPABASE_URL: https://ci.example.test
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_JWT_SECRET: ci-contract-only-jwt-secret
          ALLOWED_ORIGIN: https://ci.example.test
        run: npm run quality

  deploy-cloudflare:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
      # After the first deployment, configure the stable Worker route or custom
      # domain in Cloudflare and run `npm run verify:deployment -- <https-url>`.
